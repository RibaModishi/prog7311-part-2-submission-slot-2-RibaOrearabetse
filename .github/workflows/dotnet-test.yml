# Runs your xUnit tests on every push + pull request to the default branch.
# Uses the same .NET SDK as your project (net10.0).
name: GLMS tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore, build, and test
        run: dotnet test GLMS/GLMS.slnx --configuration Release --verbosity normal
